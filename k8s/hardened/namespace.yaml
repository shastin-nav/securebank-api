# Namespace con Pod Security Admission en "restricted": el API server rechaza cualquier Pod
# privilegiado, como root o con capabilities extra, aunque el manifiesto lo pida.
apiVersion: v1
kind: Namespace
metadata:
  name: securebank
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
