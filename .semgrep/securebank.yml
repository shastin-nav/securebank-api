# Reglas SAST propias para SecureBank (complementan p/owasp-top-ten).
# Cada regla mapea a una amenaza del threat model (Sesión 3) y a una categoría OWASP.
rules:
  - id: securebank-sql-string-concat
    languages: [python]
    severity: ERROR
    message: >
      Consulta SQL construida por concatenación de strings (AM-04, A03 Injection).
      Usar consultas parametrizadas: cursor.execute(sql, (param,)).
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-89"
      threat: AM-04
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." + $X)
          - pattern: $CUR.execute("..." + $X + "...")
          - pattern: |
              $Q = "..." + $X
              ...
              $CUR.execute($Q)
          - pattern: |
              $Q = "..." + $X + "..."
              ...
              $CUR.execute($Q)
          - pattern: |
              $Q = f"..."
              ...
              $CUR.execute($Q)

  - id: securebank-command-injection-shell-true
    languages: [python]
    severity: ERROR
    message: >
      Ejecución de comando de sistema con shell=True sobre datos de entrada (AM-12, A03).
      Usar subprocess.run([...], shell=False) con lista de argumentos, o evitar la shell.
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-78"
      threat: AM-12
    patterns:
      - pattern-either:
          - pattern: subprocess.check_output(..., shell=True)
          - pattern: subprocess.call(..., shell=True)
          - pattern: subprocess.run(..., shell=True)
          - pattern: os.system(...)

  - id: securebank-dangerous-eval
    languages: [python]
    severity: ERROR
    message: >
      Uso de eval() sobre datos del usuario (AM-12, A03 · función peligrosa) => RCE.
      Usar ast.literal_eval o un parser numérico propio.
    metadata:
      owasp: "A03:2021 - Injection"
      cwe: "CWE-95"
      threat: AM-12
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  - id: securebank-weak-hash-md5
    languages: [python]
    severity: ERROR
    message: >
      Hash criptográficamente roto (MD5) para contraseñas (AM-14, A02 Cryptographic Failures).
      Usar werkzeug.security.generate_password_hash (scrypt/pbkdf2 con sal).
    metadata:
      owasp: "A02:2021 - Cryptographic Failures"
      cwe: "CWE-327"
      threat: AM-14
    patterns:
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)

  - id: securebank-xss-fstring-html
    languages: [python]
    severity: ERROR
    message: >
      HTML construido con f-string e interpolación de entrada del usuario (AM-13, A03 · XSS).
      Renderizar con plantillas Jinja (autoescape) o escapar con markupsafe.escape().
    metadata:
      owasp: "A03:2021 - Injection (XSS)"
      cwe: "CWE-79"
      threat: AM-13
    pattern: return f"..."
